<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings Page</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body class="page-settings">
    <header>
      <div class="header-container">
        <nav>
          <!-- Search Bar -->
          <div class="search-bar">
            <div class="search-bar-box">
              <input
                type="text"
                name="search"
                id="search"
                placeholder="Enter the keyword here..."
              />
            </div>
          </div>
          <div class="archive-and-account-container">
            <!-- Order Archive -->
            <div class="order-archive" id="openOrderArchive">
              <div class="order-archive-logo">
                <img src="assets/archive-add.png" alt="Order Archive Logo" />
              </div>
              <div class="order-archive-text">
                <p>Order Archive</p>
              </div>
            </div>
            <!-- Navbar Account -->
            <div class="navbar-account">
              <a href="settings.html">
                <div class="account-image">
                  <img src="assets/account-image.png" alt="Account Image" />
                </div>
              </a>
              <a href="settings.html">
                <div class="account-name-title">
                  <div class="account-name">
                    <p>John Doe</p>
                  </div>
                  <div class="account-title">
                    <p>Cashier</p>
                  </div>
                </div>
              </a>
              <div class="logout-icon">
                <a href="index.html">
                  <img src="assets/logout-cashier.png" alt="Logout Icon" />
                </a>
              </div>
            </div>
          </div>
        </nav>
      </div>
    </header>
    <main>
      <aside class="sidebar" id="sidebar">
        <!-- Logo Section -->
        <section class="logo-section">
          <div class="logo-and-minimize">
            <!-- Logo -->
            <div class="logo">
              <a href="cashier.html">
                <img src="assets/padipos-logo.png" alt="Cashier Logo" />
              </a>
            </div>
            <!-- Minimize Sidebar -->
            <div class="minimize-sidebar">
              <img src="assets/arrow-left.png" alt="Minimize Sidebar Icon" />
            </div>
          </div>
        </section>

        <!-- Cashier Section -->
        <section class="cashier-section">
          <div class="cashier-icon">
            <a href="cashier.html">
              <img src="assets/shop-icon.png" alt="Cashier Section Icon" />
            </a>
          </div>
          <div class="cashier-text">
            <a href="cashier.html">
              <p>Cashier</p>
            </a>
          </div>
        </section>

        <!-- Sales Report Section -->
        <section class="sales-report-section" id="sales-report-section">
          <div class="sales-report-icon">
            <a href="sales_report.html">
              <img src="assets/report-icon.png" alt="Cashier Section Icon" />
            </a>
          </div>
          <div class="sales-report-text">
            <a href="sales_report.html">
              <p>Sales Report</p>
            </a>
          </div>
        </section>

        <!-- Settings Section -->
        <section class="settings-section">
          <div class="settings-icon">
            <a href="settings.html">
              <img
                src="assets/settings-icon-selected.png"
                alt="Cashier Section Icon"
              />
            </a>
          </div>
          <div class="settings-text">
            <a href="settings.html">
              <p>Settings</p>
            </a>
          </div>
          <div class="side-bar-selected">
            <img
              src="assets/side-bar-selected.png"
              alt="Side Bar Selected Icon"
            />
          </div>
        </section>
      </aside>
      <section class="main-content">
        <div class="container">
          <div class="settings-body">
            <div class="settings-title">
              <h1>Settings</h1>
            </div>
            <div class="settings-main">
              <div class="settings-account">
                <div class="account-profile">
                  <div class="account-title">
                    <h2>Account</h2>
                  </div>
                  <div class="account-picture">
                    <img
                      src="assets/settings-account-image.png"
                      alt="Settings Account Picture"
                    />
                    <div class="change-delete-picture">
                      <div class="change-picture-account">
                        <p>Change Picture</p>
                      </div>
                      <div class="delete-picture-account">
                        <p>Delete Picture</p>
                      </div>
                    </div>
                  </div>
                  <div class="account-data">
                    <form action="" method="post">
                      <div class="form-email">
                        <label for="email">Email</label>
                        <input
                          type="email"
                          namee="email"
                          id="email"
                          value="johndoe@gmail.com"
                          autocomplete="johndoe@gmail.com"
                        />
                      </div>
                      <div class="form-username">
                        <label for="username">Username</label>
                        <input
                          type="text"
                          name="username"
                          id="username"
                          value="John Doe"
                          autocomplete="John Doe"
                        />
                      </div>
                      <div class="form-role">
                        <label for="role">Role</label>
                        <input
                          type="text"
                          name="role"
                          id="role"
                          value="Cashier"
                        />
                      </div>
                      <div class="form-status">
                        <label for="status">Status</label>
                        <input
                          type="text"
                          name="status"
                          id="status"
                          value="Active"
                        />
                      </div>
                      <div class="form-languange">
                        <label for="languange">Languange</label>
                        <select name="languange" id="languange">
                          <option value="English" selected>English</option>
                          <option value="Indonesia">Indonesia</option>
                        </select>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
              <hr />
              <div class="settings-account-password">
                <h1>Password</h1>
                <div class="change-password">
                  <label for="password">Password</label>
                  <input
                    type="password"
                    name="password"
                    id="password"
                    value="******"
                    autocomplete="******"
                  />
                  <button>Change Password</button>
                </div>
              </div>
              <hr />
              <div class="settings-account-appearance">
                <h1>Appearance</h1>
                <div class="appearance-settings">
                  <div class="preference-mode">
                    <label for="preference">Preference Mode</label>
                    <select name="preference" id="preference">
                      <option value="Light Mode" selected>Light Mode</option>
                      <option value="Dark Mode">Dark Mode</option>
                    </select>
                  </div>
                  <div class="font-size">
                    <label for="font">Font Size</label>
                    <select name="font" id="font">
                      <option value="16px" selected>16 px</option>
                      <option value="14px">14 px</option>
                      <option value="12px">12 px</option>
                    </select>
                  </div>
                  <div class="zoom-display">
                    <label for="zoom">Zoom Display</label>
                    <select name="font" id="font">
                      <option value="16px" selected>16 px</option>
                      <option value="14px">14 px</option>
                      <option value="12px">12 px</option>
                    </select>
                  </div>
                </div>
              </div>
              <hr />
              <div class="settings-save-changes">
                <button>Save Changes</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>

    <!-- Modal Order Archive -->
    <div class="modal-overlay" id="orderArchiveModal" style="display: none">
      <div class="order-archive-modal">
        <div class="modal-header" id="modal-order-archive">
          <h1>Order Archive</h1>
          <span class="modal-close" id="closeOrderArchive">&times;</span>
        </div>

        <!-- Search Section -->
        <div class="order-archive-search">
          <input
            type="text"
            id="searchArchiveInput"
            placeholder="Enter the keyword here..."
          />

          <select id="archiveTypeFilter">
            <option value="">Select type order</option>
            <option value="Dine In">Dine In</option>
            <option value="Take Away">Take Away</option>
          </select>

          <button id="searchArchiveBtn">Search</button>
        </div>

        <!-- Archive List -->
        <div class="order-archive-list" id="orderArchiveList"></div>
      </div>
    </div>

    <script src="cashier.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
