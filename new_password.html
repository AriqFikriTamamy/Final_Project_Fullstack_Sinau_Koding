<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="new_password.css" />

    <!-- Google Font -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="new-password-container">
          <div class="new-password-content">
            <!-- Logo -->
            <div class="new-password-logo">
              <img src="assets/login-logo.png" alt="Reset Password Logo" />
            </div>
            <!-- Title -->
            <div class="new-password-title">
              <h1>Reset Password</h1>
              <h2>Please enter your new password and confirm</h2>
            </div>
            <!-- Form -->
            <div class="new-password-form">
              <div class="form-new-password">
                <label>New Password</label>
                <div class="password-wrapper">
                  <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Password"
                  />
                  <span class="toggle-password" onclick="togglePassword()">
                    <img src="assets/eye-slash.png" alt="Show Password" />
                  </span>
                </div>
              </div>
              <div class="confirm-new-password">
                <label>Confirm New Password</label>
                <div class="password-wrapper">
                  <input
                    type="password"
                    name="confirm-password"
                    id="confirm-password"
                    placeholder="Confirm Password"
                  />
                  <span
                    class="toggle-password"
                    onclick="toggleConfirmPassword()"
                  >
                    <img src="assets/eye-slash.png" alt="Show Password" />
                  </span>
                </div>
              </div>
              <div class="form-button">
                <a href="index.html">
                  <button class="reset-password">Reset Password</button>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script>
      function togglePassword() {
        const input = document.getElementById("password");
        input.type = input.type === "password" ? "text" : "password";
      }
      function toggleConfirmPassword() {
        const inputConfirm = document.getElementById("confirm-password");
        inputConfirm.type =
          inputConfirm.type === "password" ? "text" : "password";
      }
    </script>
  </body>
</html>
