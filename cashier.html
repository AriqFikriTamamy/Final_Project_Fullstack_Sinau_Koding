<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS Cashier</title>
    <link rel="stylesheet" href="cashier.css" />

    <!-- Google Font -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
  </head>
  <body>
    <header>
      <div class="header-container">
        <nav>
          <!-- Search Bar -->
          <div class="search-bar">
            <div class="search-bar-box">
              <input
                type="text"
                name="search"
                id="search"
                placeholder="Enter the keyword here..."
              />
            </div>
          </div>
          <div class="archive-and-account-container">
            <!-- Order Archive -->
            <div class="order-archive">
              <div class="order-archive-logo">
                <img src="assets/archive-add.png" alt="Order Archive Logo" />
              </div>
              <div class="order-archive-text">
                <p>Order Archive</p>
              </div>
            </div>
            <!-- Navbar Account -->
            <div class="navbar-account">
              <a href="#">
                <div class="account-image">
                  <img src="assets/account-image.png" alt="Account Image" />
                </div>
              </a>
              <a href="#">
                <div class="account-name-title">
                  <div class="account-name">
                    <p>John Doe</p>
                  </div>
                  <div class="account-title">
                    <p>Cashier</p>
                  </div>
                </div>
              </a>
              <div class="logout-icon">
                <a href="#">
                  <img src="assets/logout-cashier.png" alt="Logout Icon" />
                </a>
              </div>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <main>
        <aside class="sidebar" id="sidebar">
          <!-- Logo Section -->
          <section class="logo-section">
            <div class="logo-and-minimize">
              <!-- Logo -->
              <div class="logo">
                <a href="cashier.html">
                  <img src="assets/padipos-logo.png" alt="Cashier Logo" />
                </a>
              </div>
              <!-- Minimize Sidebar -->
              <div class="minimize-sidebar">
                <img src="assets/arrow-left.png" alt="Minimize Sidebar Icon" />
              </div>
            </div>
          </section>

          <!-- Cashier Section -->
          <section class="cashier-section">
            <div class="cashier-icon">
              <a href="cashier.html">
                <img
                  src="assets/shop-icon-selected.png"
                  alt="Cashier Section Icon"
                />
              </a>
            </div>
            <div class="cashier-text">
              <a href="cashier.html">
                <p>Cashier</p>
              </a>
            </div>
            <div class="side-bar-selected">
              <img
                src="assets/side-bar-selected.png"
                alt="Side Bar Selected Icon"
              />
            </div>
          </section>

          <!-- Sales Report Section -->
          <section class="sales-report-section" id="sales-report-section">
            <div class="sales-report-icon">
              <a href="#">
                <img src="assets/report-icon.png" alt="Cashier Section Icon" />
              </a>
            </div>
            <div class="sales-report-text">
              <a href="#">
                <p>Sales Report</p>
              </a>
            </div>
          </section>

          <!-- Settings Section -->
          <section class="settings-section">
            <div class="settings-icon">
              <a href="#">
                <img
                  src="assets/settings-icon.png"
                  alt="Cashier Section Icon"
                />
              </a>
            </div>
            <div class="settings-text">
              <a href="#">
                <p>Settings</p>
              </a>
            </div>
          </section>
        </aside>
        <section class="main-content">
          <div class="container">
            <!-- Category Menu Section -->
            <section class="category-menu-section" id="category-menu-section">
              <div class="category-menu">
                <div class="all-menu-card">
                    <p>All Menu</p>
                </div>
                <div class="foods-card">
                  <img src="assets/foods-icon.png" alt="Foods Category Icon">
                    <p>Foods</p>
                </div>
                <div class="beverages-card">
                  <img src="assets/beverages-icon.png" alt="Foods Category Icon">
                    <p>Beverages</p>
                </div>
                <div class="dessert-card">
                  <img src="assets/dessert-icon.png" alt="Foods Category Icon">
                    <p>Dessert</p>
                </div>
              </div>
            </section>
          </div>
        </section>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
